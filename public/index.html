<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maya Checkout Studio</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 2rem auto; padding: 0 1rem; }
    .row { display: flex; gap: .5rem; margin-bottom: .5rem; }
    input { padding: .5rem; flex: 1; min-width: 0; }
    input.qty { flex: 0 0 4rem; }
    button { padding: .6rem 1rem; cursor: pointer; }
    #error { color: #b00020; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Checkout</h1>
  <div id="items"></div>
  <button type="button" id="add">+ Add item</button>
  <p><strong>Total: PHP <span id="total">0.00</span></strong></p>
  <button type="button" id="pay">Pay with PayMongo</button>
  <p id="error" role="alert"></p>
  <script src="app.js"></script>
</body>
</html>
